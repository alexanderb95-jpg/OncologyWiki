<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1020" role="img" aria-labelledby="title desc">
  <title id="title">KEYNOTE-564 approximate reconstructed Kaplan-Meier curves</title>
  <desc id="desc">Source-recreated disease-free and overall survival curves for pembrolizumab and placebo. The complete curve traces were approximately digitized from published KEYNOTE-564 figures; exact published landmark estimates at 12, 24, 36, and 48 months are labelled.</desc>
  <style>
    .title { fill:#1c1917; font:600 20px Arial,sans-serif; }
    .subtitle { fill:#57534e; font:13px Arial,sans-serif; }
    .panel-title { fill:#1c1917; font:600 16px Arial,sans-serif; }
    .label { fill:#44403c; font:12px Arial,sans-serif; }
    .small { fill:#57534e; font:11px Arial,sans-serif; }
    .axis { stroke:#78716c; stroke-width:1.25; }
    .grid { stroke:#e7e5e4; stroke-width:1; }
    .landmark { stroke:#a8a29e; stroke-width:1; stroke-dasharray:4 4; }
    .pembro { fill:none; stroke:#1d4ed8; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    .placebo { fill:none; stroke:#b45309; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    .pembro-dot { fill:#1d4ed8; }
    .placebo-dot { fill:#b45309; }
  </style>
  <rect width="980" height="1020" fill="#fffcf7"/>
  <text x="52" y="34" class="title">KEYNOTE-564 disease-free and overall survival</text>
  <text x="52" y="55" class="subtitle">Pembrolizumab 200 mg every 3 weeks for up to 17 cycles versus placebo; N=994</text>

  <text x="100" y="91" class="panel-title">A. Disease-free survival</text>
  <text x="100" y="111" class="subtitle">HR 0.72 (95% CI 0.59-0.87) at the September 15, 2023 data cutoff</text>
  <line x1="100" y1="130" x2="900" y2="130" class="grid"/>
  <line x1="100" y1="190" x2="900" y2="190" class="grid"/>
  <line x1="100" y1="250" x2="900" y2="250" class="grid"/>
  <line x1="100" y1="310" x2="900" y2="310" class="grid"/>
  <line x1="100" y1="370" x2="900" y2="370" class="grid"/>
  <line x1="100" y1="430" x2="900" y2="430" class="axis"/>
  <line x1="100" y1="130" x2="100" y2="430" class="axis"/>
  <text x="62" y="134" class="label">100%</text>
  <text x="68" y="194" class="label">90%</text>
  <text x="68" y="254" class="label">80%</text>
  <text x="68" y="314" class="label">70%</text>
  <text x="68" y="374" class="label">60%</text>
  <text x="68" y="434" class="label">50%</text>
  <line x1="228" y1="130" x2="228" y2="430" class="landmark"/>
  <line x1="356" y1="130" x2="356" y2="430" class="landmark"/>
  <line x1="484" y1="130" x2="484" y2="430" class="landmark"/>
  <line x1="612" y1="130" x2="612" y2="430" class="landmark"/>
  <path class="pembro" fill="none" stroke="#1d4ed8" stroke-width="3" d="M100 130 H132 V151 H164 V175 H196 V202 H228 V217 H260 V232 H292 V241 H324 V253 H356 V261 H388 V265 H420 V277 H452 V286 H484 V296 H516 V303 H548 V314 H580 V332 H612 V341 H644 V347 H676 V355 H708 V361 H740 V367 H772 V372 H804 V381 H836 V389 H868 V395 H900 V400"/>
  <path class="placebo" fill="none" stroke="#b45309" stroke-width="3" d="M100 130 H132 V160 H164 V205 H196 V247 H228 V273 H260 V289 H292 V307 H324 V320 H356 V327 H388 V334 H420 V342 H452 V349 H484 V353 H516 V362 H548 V376 H580 V384 H612 V390 H644 V401 H676 V412 H708 V421 H740 V430 H772 V436 H804 V442 H836 V445 H868 V448 H900 V451"/>
  <circle cx="228" cy="217" r="4.5" fill="#1d4ed8"/>
  <circle cx="228" cy="273" r="4.5" fill="#b45309"/>
  <circle cx="356" cy="260" r="4.5" fill="#1d4ed8"/>
  <circle cx="356" cy="327" r="4.5" fill="#b45309"/>
  <circle cx="484" cy="298" r="4.5" fill="#1d4ed8"/>
  <circle cx="484" cy="353" r="4.5" fill="#b45309"/>
  <circle cx="612" cy="341" r="4.5" fill="#1d4ed8"/>
  <circle cx="612" cy="390" r="4.5" fill="#b45309"/>
  <text x="100" y="469" class="small">Landmarks (12, 24, 36, and 48 months): pembrolizumab 85.5%, 78.2%, 72.4%, 64.9%</text>
  <text x="100" y="486" class="small">Placebo 76.1%, 67.2%, 62.9%, 56.6%</text>

  <text x="100" y="530" class="panel-title">B. Overall survival</text>
  <text x="100" y="550" class="subtitle">HR 0.62 (95% CI 0.44-0.87); two-sided P=.005 at the September 15, 2023 data cutoff</text>
  <line x1="100" y1="574" x2="900" y2="574" class="grid"/>
  <line x1="100" y1="646" x2="900" y2="646" class="grid"/>
  <line x1="100" y1="718" x2="900" y2="718" class="grid"/>
  <line x1="100" y1="790" x2="900" y2="790" class="grid"/>
  <line x1="100" y1="826" x2="900" y2="826" class="axis"/>
  <line x1="100" y1="574" x2="100" y2="826" class="axis"/>
  <text x="62" y="578" class="label">100%</text>
  <text x="68" y="650" class="label">90%</text>
  <text x="68" y="722" class="label">80%</text>
  <text x="68" y="794" class="label">70%</text>
  <line x1="228" y1="574" x2="228" y2="826" class="landmark"/>
  <line x1="356" y1="574" x2="356" y2="826" class="landmark"/>
  <line x1="484" y1="574" x2="484" y2="826" class="landmark"/>
  <line x1="612" y1="574" x2="612" y2="826" class="landmark"/>
  <path class="pembro" fill="none" stroke="#1d4ed8" stroke-width="3" d="M100 574 H132 V576 H164 V578 H196 V581 H228 V584 H260 V589 H292 V594 H324 V598 H356 V601 H388 V604 H420 V608 H452 V613 H484 V618 H516 V624 H548 V628 H580 V633 H612 V637 H644 V646 H676 V654 H708 V659 H740 V666 H772 V672 H804 V677 H836 V682 H868 V685 H900 V688"/>
  <path class="placebo" fill="none" stroke="#b45309" stroke-width="3" d="M100 574 H132 V576 H164 V580 H196 V584 H228 V588 H260 V598 H292 V608 H324 V614 H356 V618 H388 V628 H420 V637 H452 V645 H484 V650 H516 V659 H548 V668 H580 V672 H612 V675 H644 V685 H676 V698 H708 V708 H740 V717 H772 V725 H804 V733 H836 V738 H868 V742 H900 V745"/>
  <circle cx="228" cy="584" r="4.5" fill="#1d4ed8"/>
  <circle cx="228" cy="588" r="4.5" fill="#b45309"/>
  <circle cx="356" cy="601" r="4.5" fill="#1d4ed8"/>
  <circle cx="356" cy="618" r="4.5" fill="#b45309"/>
  <circle cx="484" cy="618" r="4.5" fill="#1d4ed8"/>
  <circle cx="484" cy="649" r="4.5" fill="#b45309"/>
  <circle cx="612" cy="637" r="4.5" fill="#1d4ed8"/>
  <circle cx="612" cy="675" r="4.5" fill="#b45309"/>

  <text x="100" y="852" class="small">Landmarks (12, 24, 36, and 48 months): pembrolizumab 98.6%, 96.3%, 93.9%, 91.2%</text>
  <text x="100" y="869" class="small">Placebo 98.0%, 93.9%, 89.5%, 86.0%</text>

  <line x1="100" y1="826" x2="900" y2="826" class="axis"/>
  <g class="label">
    <text x="96" y="893">0</text><text x="158" y="893">6</text><text x="222" y="893">12</text><text x="350" y="893">24</text><text x="478" y="893">36</text><text x="606" y="893">48</text><text x="734" y="893">60</text><text x="862" y="893">72</text>
  </g>
  <text x="445" y="917" class="label">Months since randomization</text>
  <line x1="110" y1="946" x2="140" y2="946" stroke="#1d4ed8" stroke-width="3"/>
  <text x="148" y="950" class="label">Pembrolizumab</text>
  <line x1="300" y1="946" x2="330" y2="946" stroke="#b45309" stroke-width="3"/>
  <text x="338" y="950" class="label">Placebo</text>
  <text x="100" y="977" class="small">Curve positions between published landmarks are approximate visual digitization of Choueiri et al., NEJM 2024, PMID 38631003, Figures 1A and 2A.</text>
  <text x="100" y="996" class="small">Published landmark estimates are displayed in separate rows so labels do not obscure the curves; this is not journal artwork or individual-patient data.</text>
</svg>
