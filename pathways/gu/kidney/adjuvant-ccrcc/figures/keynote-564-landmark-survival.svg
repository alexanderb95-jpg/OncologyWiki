<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">KEYNOTE-564 published 5-year disease-free and overall survival landmarks</title>
  <desc id="desc">Two source-recreated landmark displays show baseline and published 5-year estimates for pembrolizumab and placebo. They are not Kaplan-Meier curves.</desc>
  <style>
    .title { fill: #1c1917; font: 600 18px Arial, sans-serif; }
    .subtitle { fill: #57534e; font: 13px Arial, sans-serif; }
    .axis { stroke: #a8a29e; stroke-width: 1; }
    .grid { stroke: #e7e5e4; stroke-width: 1; }
    .label { fill: #44403c; font: 12px Arial, sans-serif; }
    .small { fill: #57534e; font: 11px Arial, sans-serif; }
    .dot-pembro { fill: #1d4ed8; }
    .dot-placebo { fill: #b45309; }
  </style>
  <rect width="960" height="430" fill="#fffcf7"/>
  <text x="48" y="32" class="title">KEYNOTE-564 published survival landmarks</text>
  <text x="48" y="53" class="subtitle">Pembrolizumab for up to 17 cycles versus placebo; N=994; 5-year analysis</text>

  <text x="80" y="88" class="title">Disease-free survival</text>
  <text x="80" y="108" class="subtitle">5-year HR 0.71 (95% CI 0.59-0.86)</text>
  <line x1="80" y1="130" x2="430" y2="130" class="grid"/>
  <line x1="80" y1="170" x2="430" y2="170" class="grid"/>
  <line x1="80" y1="210" x2="430" y2="210" class="grid"/>
  <line x1="80" y1="250" x2="430" y2="250" class="grid"/>
  <line x1="80" y1="130" x2="80" y2="250" class="axis"/>
  <line x1="80" y1="250" x2="430" y2="250" class="axis"/>
  <text x="45" y="134" class="label">100%</text>
  <text x="51" y="174" class="label">80%</text>
  <text x="51" y="214" class="label">60%</text>
  <text x="51" y="254" class="label">40%</text>
  <text x="70" y="274" class="label">0 y</text>
  <text x="402" y="274" class="label">5 y</text>
  <text x="192" y="298" class="small">Years since randomization</text>
  <circle cx="80" cy="130" r="6" fill="#44403c"/>
  <text x="91" y="124" class="small">100% both arms</text>
  <circle cx="410" cy="208.2" r="6" class="dot-pembro"/>
  <text x="328" y="203" class="label">Pembrolizumab 60.9%</text>
  <circle cx="410" cy="225.6" r="6" class="dot-placebo"/>
  <text x="348" y="244" class="label">Placebo 52.2%</text>

  <text x="530" y="88" class="title">Overall survival</text>
  <text x="530" y="108" class="subtitle">5-year HR 0.66 (95% CI 0.48-0.90)</text>
  <line x1="530" y1="130" x2="880" y2="130" class="grid"/>
  <line x1="530" y1="170" x2="880" y2="170" class="grid"/>
  <line x1="530" y1="210" x2="880" y2="210" class="grid"/>
  <line x1="530" y1="250" x2="880" y2="250" class="grid"/>
  <line x1="530" y1="130" x2="530" y2="250" class="axis"/>
  <line x1="530" y1="250" x2="880" y2="250" class="axis"/>
  <text x="495" y="134" class="label">100%</text>
  <text x="501" y="174" class="label">90%</text>
  <text x="501" y="214" class="label">80%</text>
  <text x="501" y="254" class="label">70%</text>
  <text x="520" y="274" class="label">0 y</text>
  <text x="852" y="274" class="label">5 y</text>
  <text x="642" y="298" class="small">Years since randomization</text>
  <circle cx="530" cy="130" r="6" fill="#44403c"/>
  <text x="541" y="124" class="small">100% both arms</text>
  <circle cx="860" cy="179.2" r="6" class="dot-pembro"/>
  <text x="754" y="174" class="label">Pembrolizumab 87.7%</text>
  <circle cx="860" cy="201.2" r="6" class="dot-placebo"/>
  <text x="776" y="220" class="label">Placebo 82.3%</text>

  <circle cx="80" cy="340" r="5" class="dot-pembro"/>
  <text x="92" y="344" class="label">Pembrolizumab</text>
  <circle cx="250" cy="340" r="5" class="dot-placebo"/>
  <text x="262" y="344" class="label">Placebo</text>
  <text x="80" y="375" class="small">Haas et al., Annals of Oncology 2026, PMID 42648402. Median follow-up 70 months.</text>
  <text x="80" y="397" class="small">Source-recreated 0- and 5-year landmark display only; not a Kaplan-Meier curve and no values are interpolated.</text>
</svg>
